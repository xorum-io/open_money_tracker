apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace = "com.blogspot.e_kanivets.moneytracker"

    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.blogspot.e_kanivets.moneytracker'
        minSdkVersion 21
        targetSdkVersion 34

        versionCode 46
        versionName '2.3.0'
    }

    signingConfigs {
        releaseConfig {
            storeFile file('mt_keystore.jks')
            storePassword('moneytracker')
            keyAlias 'moneytracker'
            keyPassword 'moneytracker'
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.releaseConfig
        }

        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.releaseConfig
        }
    }

    flavorDimensions "edition"
    productFlavors {
        free {
            dimension "edition"
        }
        proprietary {
            dimension "edition"
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'io.insert-koin:koin-android:3.5.6' // Koin DI
    implementation 'com.github.PhilJay:MPAndroidChart:v2.2.4' // Charts
    implementation 'com.jakewharton.timber:timber:4.7.1' // Advanced logging tool
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'com.dropbox.core:dropbox-core-sdk:4.0.0' // Dropbox Core API

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    androidTestImplementation 'com.crittercism.dexmaker:dexmaker:1.4'
    androidTestImplementation 'com.crittercism.dexmaker:dexmaker-dx:1.4'
    androidTestImplementation 'com.crittercism.dexmaker:dexmaker-mockito:1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'com.google.firebase:firebase-analytics:19.0.2'
    implementation 'com.google.firebase:firebase-crashlytics:18.2.3'
}
